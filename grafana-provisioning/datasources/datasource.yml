apiVersion: 1

datasources:
  - name: InfluxDB-ICA
    uid: influxdb-ica
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: calidad_aire_db
    user: $INFLUXDB_USER
    jsonData:
      version: InfluxQL
      timeInterval: 5m
    secureJsonData:
      password: $INFLUXDB_PASSWORD
    isDefault: true
    editable: true
