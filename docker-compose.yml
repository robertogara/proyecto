services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - iot-net

  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: calidad_aire_db
      INFLUXDB_ADMIN_USER: ${INFLUXDB_USER:?Define INFLUXDB_USER in .env}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_PASSWORD:?Define INFLUXDB_PASSWORD in .env}
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - iot-net

  telegraf:
    image: telegraf:1.18
    restart: unless-stopped
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      INFLUXDB_USER: ${INFLUXDB_USER:?Define INFLUXDB_USER in .env}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD:?Define INFLUXDB_PASSWORD in .env}
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - iot-net

  ingesta-ica:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ICA_CSV_URL: https://ica.miteco.es/datos/ica-ultima-hora.csv
      POLL_INTERVAL_SECONDS: "300"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: calidad-aire/estaciones
      MQTT_CLIENT_ID: miteco-ica-ingesta
    depends_on:
      - mosquitto
      - telegraf
    networks:
      - iot-net

  grafana:
    image: grafana/grafana:12.4.15
    ports:
      - "3000:3000"
    environment:
      INFLUXDB_USER: ${INFLUXDB_USER:?Define INFLUXDB_USER in .env}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD:?Define INFLUXDB_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning/:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb
    networks:
      - iot-net

volumes:
  influxdb_data:
  grafana_data:
  mosquitto_data:

networks:
  iot-net:
    driver: bridge
